<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Review your tour with Paul</title>
  <meta name="description" content="Leave a Tripadvisor review for your Paris bike tour with Paul.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <style>
    :root {
      color-scheme: light;
      --ink: #111;
      --muted: #666;
      --paper: #f4f1ea;
      --card: #fff;
      --line: #ded9cf;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 520px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: clamp(28px, 7vw, 48px);
      box-shadow: 0 16px 50px rgba(0,0,0,.08);
    }
    .eyebrow {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
      margin: 0 0 18px;
    }
    h1 {
      font-size: clamp(38px, 10vw, 62px);
      line-height: .96;
      letter-spacing: -.045em;
      margin: 0 0 24px;
    }
    p {
      font-size: 18px;
      line-height: 1.5;
      margin: 0 0 18px;
    }
    .note {
      background: #f7f7f5;
      border: 1px solid #e5e3dd;
      border-radius: 14px;
      padding: 16px 17px;
      margin: 24px 0;
      font-size: 16px;
      line-height: 1.45;
    }
    .note strong { font-weight: 800; }
    a.button {
      display: block;
      width: 100%;
      background: var(--ink);
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      padding: 17px 20px;
      border-radius: 12px;
      margin-top: 26px;
    }
    a.button:active { transform: translateY(1px); }
    .thanks {
      margin-top: 22px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Boutique Bike Tours · Paris</p>
    <h1>Had a great tour with Paul?</h1>
    <p>Thanks for taking a moment to leave a review. It genuinely helps.</p>

    <div class="note">
      <strong>Please mention “Paul” by name</strong> somewhere in your review so Boutique can credit it to the right guide.
    </div>

    <a class="button"
       href="https://www.tripadvisor.com/UserReviewEdit-g187147-d12442407-Boutique_Tours_Boutique_Bike_Tours-Paris_Ile_de_France.html"
       rel="noopener noreferrer">
      Leave a Tripadvisor review
    </a>

    <p class="thanks">Thank you — and enjoy the rest of Paris.</p>
  </main>
</body>
</html>
